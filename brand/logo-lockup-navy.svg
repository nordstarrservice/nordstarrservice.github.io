<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NordStar Service">
  <g fill="none" stroke="#0A1C34" stroke-width="4.5" stroke-linecap="round">
    <!-- orbit ellipse, tilted -->
    <ellipse cx="256" cy="168" rx="118" ry="52" transform="rotate(-28 256 168)"/>
  </g>
  <!-- 8-point compass star with facet splits -->
  <g transform="translate(256 168)">
    <!-- outer star points (alternating light/dark facets via opacity) -->
    <path fill="#0A1C34" d="M0,-78 L12,-18 L0,-12 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M0,-78 L-12,-18 L0,-12 Z"/>
    <path fill="#0A1C34" d="M78,0 L18,-12 L12,0 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M78,0 L18,12 L12,0 Z"/>
    <path fill="#0A1C34" d="M0,78 L-12,18 L0,12 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M0,78 L12,18 L0,12 Z"/>
    <path fill="#0A1C34" d="M-78,0 L-18,12 L-12,0 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M-78,0 L-18,-12 L-12,0 Z"/>
    <!-- diagonal points -->
    <path fill="#0A1C34" d="M55.15,-55.15 L18,-6 L8,-8 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M55.15,-55.15 L6,-18 L8,-8 Z"/>
    <path fill="#0A1C34" d="M55.15,55.15 L6,18 L8,8 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M55.15,55.15 L18,6 L8,8 Z"/>
    <path fill="#0A1C34" d="M-55.15,55.15 L-18,6 L-8,8 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M-55.15,55.15 L-6,18 L-8,8 Z"/>
    <path fill="#0A1C34" d="M-55.15,-55.15 L-6,-18 L-8,-8 Z"/>
    <path fill="#0A1C34" fill-opacity=".72" d="M-55.15,-55.15 L-18,-6 L-8,-8 Z"/>
    <circle fill="#0A1C34" r="10"/>
  </g>
  <text x="256" y="320" text-anchor="middle" fill="#0A1C34"
        font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="54" font-weight="700" letter-spacing="6">NORDSTAR</text>
  <g stroke="#0A1C34" stroke-width="2.5" stroke-linecap="round">
    <line x1="96" y1="368" x2="178" y2="368"/>
    <line x1="334" y1="368" x2="416" y2="368"/>
  </g>
  <text x="256" y="376" text-anchor="middle" fill="#0A1C34"
        font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="28" font-weight="500" letter-spacing="10">SERVICE</text>
</svg>
